<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar Segmento - Paso 1 - Eat & Bite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="confirmation-container success" style="max-width: 500px;">
        <div style="font-size: 3rem; color: #2e7d32; margin-bottom: 15px;">💾</div>
        <h3>Guardar Nuevo Segmento (Paso 1 de 2)</h3>
        <p>Defina un nombre comercial y descriptivo para el segmento de marketing actual:</p>
        
        <form action="confirmar_segmento_guardar2.html" method="GET" style="text-align: left; margin-bottom: 20px;">
            <div class="form-group">
                <label for="nombre_segmento">Nombre del Segmento</label>
                <input type="text" id="nombre_segmento" name="nombre" value="Jóvenes Bogotá - Salmón Grill Preferente" required placeholder="Ej: Clientes Frecuentes Veganos">
            </div>
            
            <div class="form-group">
                <label for="desc_segmento">Descripción Interna</label>
                <textarea id="desc_segmento" name="descripcion" rows="3" placeholder="Ej: Usuarios de Bogotá entre 18 y 25 años con compras semanales.">Usuarios de Bogotá entre 18 y 25 años con frecuencia de compra semanal y gusto por el plato Salmón Grill.</textarea>
            </div>
            
            <div class="confirmation-buttons" style="justify-content: flex-end;">
                <a href="segmentacion.html" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-primary">Continuar al Paso 2</button>
            </div>
        </form>
    </div>

</body>
</html>
