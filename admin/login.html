<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - Eat and Bite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div class="confirmation-container" style="max-width: 450px; margin: 30px auto; border: 1px solid #2e7d32; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.15);">
        <div style="margin-bottom: 20px; text-align: center;">
            <img src="../Michell/img/eatandbite_temp.png" alt="Eat & Bite" style="max-height: 60px; margin-bottom: 10px;" onerror="this.src='../img/logo_1.png'">
            <h2 style="color: #2e7d32; font-size: 1.6rem; margin-top: 10px;">Portal de Administración</h2>
            <p style="color: #666; font-size: 0.9rem;">Eat & Bite - Control de Calidad e Ingresos</p>
        </div>

        <form action="home.html" method="GET" style="text-align: left;">
            <div class="form-group">
                <label for="username">Usuario Administrador</label>
                <input type="email" id="username" name="email" value="admin@eatandbite.com" required placeholder="admin@eatandbite.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" value="admin123" required placeholder="••••••••">
            </div>

            <div style="margin-bottom: 20px; padding: 12px; background-color: #e8f5e9; border-radius: 6px; border-left: 4px solid #2e7d32; font-size: 0.85rem; color: #1b5e20;">
                <strong>Credenciales de Prueba:</strong><br>
                Usuario: admin@eatandbite.com<br>
                Contraseña: admin123
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px;">
                Ingresar al Panel
            </button>
        </form>
    </div>

</body>
</html>
